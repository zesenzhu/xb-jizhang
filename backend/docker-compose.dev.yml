services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jizhang-backend-dev
    restart: unless-stopped
    ports:
      - "8091:8091"
    environment:
      NODE_ENV: development
      PORT: 8091
      DATABASE_URL: postgresql://jizhang:jizhang_dev_password@host.docker.internal:5439/jizhang?schema=public
      REDIS_URL: redis://host.docker.internal:6389
      JWT_ACCESS_SECRET: development-only-change-this-secret
      ACCESS_TOKEN_TTL_SECONDS: 900
      REFRESH_SESSION_TTL_SECONDS: 2592000
      CORS_ORIGINS: http://localhost:8090
    extra_hosts:
      - "host.docker.internal:host-gateway"
