services:
  postgres:
    image: postgres:16-alpine
    container_name: jizhang-postgres-prod
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-jizhang}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: ${DB_NAME:-jizhang}
    volumes:
      - jizhang-postgres-prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-jizhang} -d ${DB_NAME:-jizhang}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [jizhang-prod]

  redis:
    image: redis:7-alpine
    container_name: jizhang-redis-prod
    restart: always
    volumes:
      - jizhang-redis-prod:/data
    command: ["redis-server", "--appendonly", "yes"]
    networks: [jizhang-prod]

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${BACKEND_IMAGE:-xiaobao-jizhang-backend:latest}
    container_name: jizhang-backend-prod
    restart: always
    ports:
      - "${BACKEND_PORT:-8091}:8091"
    environment:
      NODE_ENV: production
      PORT: 8091
      DATABASE_URL: postgresql://${DB_USER:-jizhang}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-jizhang}?schema=public
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-900}
      REFRESH_SESSION_TTL_SECONDS: ${REFRESH_SESSION_TTL_SECONDS:-2592000}
      JWT_ADMIN_ACCESS_SECRET: ${JWT_ADMIN_ACCESS_SECRET:?JWT_ADMIN_ACCESS_SECRET is required}
      ADMIN_ACCESS_TOKEN_TTL_SECONDS: ${ADMIN_ACCESS_TOKEN_TTL_SECONDS:-900}
      ADMIN_REFRESH_SESSION_TTL_SECONDS: ${ADMIN_REFRESH_SESSION_TTL_SECONDS:-2592000}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [jizhang-prod]

networks:
  jizhang-prod:
    name: jizhang-prod

volumes:
  jizhang-postgres-prod:
  jizhang-redis-prod:
