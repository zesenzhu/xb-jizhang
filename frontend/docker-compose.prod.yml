services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
    image: ${FRONTEND_IMAGE:-xiaobao-jizhang-frontend:latest}
    container_name: jizhang-frontend-prod
    restart: always
    ports:
      - "${FRONTEND_PORT:-8090}:8090"
    environment:
      NODE_ENV: production
      PORT: 8090
      HOSTNAME: 0.0.0.0
