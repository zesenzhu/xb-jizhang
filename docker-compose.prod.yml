services:
  postgres:
    image: postgres:16-alpine
    container_name: jizhang-postgres-prod
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:?DB_USER is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: ${DB_NAME:?DB_NAME is required}
    volumes:
      - jizhang-postgres-prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - jizhang-prod

  redis:
    image: redis:7-alpine
    container_name: jizhang-redis-prod
    restart: always
    volumes:
      - jizhang-redis-prod:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - jizhang-prod

  backend:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE is required}
    container_name: jizhang-backend-prod
    restart: always
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8091}:8091"
    environment:
      NODE_ENV: production
      PORT: 8091
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}?schema=public
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-900}
      REFRESH_SESSION_TTL_SECONDS: ${REFRESH_SESSION_TTL_SECONDS:-2592000}
      JWT_ADMIN_ACCESS_SECRET: ${JWT_ADMIN_ACCESS_SECRET:?JWT_ADMIN_ACCESS_SECRET is required}
      ADMIN_ACCESS_TOKEN_TTL_SECONDS: ${ADMIN_ACCESS_TOKEN_TTL_SECONDS:-900}
      ADMIN_REFRESH_SESSION_TTL_SECONDS: ${ADMIN_REFRESH_SESSION_TTL_SECONDS:-2592000}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}
      ATTACHMENT_ENABLED: ${ATTACHMENT_ENABLED:-false}
      OBJECT_STORAGE_PROVIDER: ${OBJECT_STORAGE_PROVIDER:-aliyun-oss}
      OSS_REGION: ${OSS_REGION:-}
      OSS_ENDPOINT: ${OSS_ENDPOINT:-}
      OSS_INTERNAL_ENDPOINT: ${OSS_INTERNAL_ENDPOINT:-}
      OSS_BUCKET: ${OSS_BUCKET:-}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:-}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:-}
      OBJECT_STORAGE_UPLOAD_URL_TTL_SECONDS: ${OBJECT_STORAGE_UPLOAD_URL_TTL_SECONDS:-600}
      OBJECT_STORAGE_READ_URL_TTL_SECONDS: ${OBJECT_STORAGE_READ_URL_TTL_SECONDS:-300}
      ATTACHMENT_MAX_BYTES: ${ATTACHMENT_MAX_BYTES:-10485760}
      ATTACHMENT_MAX_PER_TRANSACTION: ${ATTACHMENT_MAX_PER_TRANSACTION:-5}
      ATTACHMENT_USER_QUOTA_BYTES: ${ATTACHMENT_USER_QUOTA_BYTES:-2147483648}
      ATTACHMENT_CLEANUP_INTERVAL_SECONDS: ${ATTACHMENT_CLEANUP_INTERVAL_SECONDS:-600}
    command: ["node", "dist/src/main.js"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8091/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - jizhang-prod

  frontend:
    image: ${FRONTEND_IMAGE:?FRONTEND_IMAGE is required}
    container_name: jizhang-frontend-prod
    restart: always
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8090}:8090"
    environment:
      NODE_ENV: production
      PORT: 8090
      HOSTNAME: 0.0.0.0
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8090/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - jizhang-prod

networks:
  jizhang-prod:
    name: jizhang-prod

volumes:
  jizhang-postgres-prod:
  jizhang-redis-prod:
