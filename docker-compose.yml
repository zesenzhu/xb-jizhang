services:
  postgres:
    image: postgres:16-alpine
    container_name: jizhang-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: jizhang
      POSTGRES_PASSWORD: jizhang_dev_password
      POSTGRES_DB: jizhang
    ports:
      - "5439:5432"
    volumes:
      - jizhang-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jizhang -d jizhang"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: jizhang-redis-dev
    restart: unless-stopped
    ports:
      - "6389:6379"
    volumes:
      - jizhang-redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]

volumes:
  jizhang-postgres-data:
  jizhang-redis-data:
