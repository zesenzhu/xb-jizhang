services:
  postgres:
    image: postgres:16-alpine
    container_name: jizhang-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: jizhang
      POSTGRES_PASSWORD: jizhang_dev_password
      POSTGRES_DB: jizhang
    ports:
      - "5439:5432"
    volumes:
      - jizhang-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jizhang -d jizhang"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - jizhang-dev

  redis:
    image: redis:7-alpine
    container_name: jizhang-redis-dev
    restart: unless-stopped
    ports:
      - "6389:6379"
    volumes:
      - jizhang-redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - jizhang-dev

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jizhang-backend-dev
    restart: unless-stopped
    ports:
      - "8091:8091"
    environment:
      NODE_ENV: development
      PORT: 8091
      DATABASE_URL: postgresql://jizhang:jizhang_dev_password@postgres:5432/jizhang?schema=public
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-development-only-change-this-secret}
      ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-900}
      REFRESH_SESSION_TTL_SECONDS: ${REFRESH_SESSION_TTL_SECONDS:-2592000}
      JWT_ADMIN_ACCESS_SECRET: ${JWT_ADMIN_ACCESS_SECRET:-development-only-change-this-admin-secret}
      ADMIN_ACCESS_TOKEN_TTL_SECONDS: ${ADMIN_ACCESS_TOKEN_TTL_SECONDS:-900}
      ADMIN_REFRESH_SESSION_TTL_SECONDS: ${ADMIN_REFRESH_SESSION_TTL_SECONDS:-2592000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8090}
    command: ["sh", "-c", "./node_modules/.bin/prisma migrate deploy && node dist/src/main.js"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8091/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - jizhang-dev

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8091/api
    container_name: jizhang-frontend-dev
    restart: unless-stopped
    ports:
      - "8090:8090"
    environment:
      NODE_ENV: production
      PORT: 8090
      HOSTNAME: 0.0.0.0
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8090/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - jizhang-dev

networks:
  jizhang-dev:
    name: jizhang-dev

volumes:
  jizhang-postgres-data:
  jizhang-redis-data:
