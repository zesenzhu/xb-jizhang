name: 发布小宝记账

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      deploy_all:
        description: 强制重新构建并发布前后端
        required: false
        type: boolean
        default: false
      sync_config:
        description: 只同步生产环境变量并重启服务，不重新构建镜像
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: xiaobao-jizhang-production
  cancel-in-progress: false

env:
  BACKEND_IMAGE_NAME: xiaobao-jizhang-backend
  FRONTEND_IMAGE_NAME: xiaobao-jizhang-frontend

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            backend/pnpm-lock.yaml
            frontend/pnpm-lock.yaml

      - name: 安装后端依赖
        run: pnpm --dir backend install --frozen-lockfile

      - name: 安装前端依赖
        run: pnpm --dir frontend install --frozen-lockfile

      - name: 生成 Prisma Client
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
        run: pnpm --dir backend prisma:generate

      - name: 类型检查
        run: pnpm typecheck

      - name: 自动化测试
        run: pnpm test

  detect:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.scope.outputs.backend }}
      frontend: ${{ steps.scope.outputs.frontend }}
      deployment: ${{ steps.scope.outputs.deployment }}
      should_deploy: ${{ steps.scope.outputs.shouldDeploy }}
    steps:
      - name: Checkout完整历史
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 计算变更范围
        id: scope
        env:
          FORCE_ALL: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_all || false }}
          FORCE_DEPLOY: ${{ github.event_name == 'workflow_dispatch' && inputs.sync_config || false }}
        run: |
          base_sha="${{ github.event.before }}"
          if [ -z "$base_sha" ] || [ "$base_sha" = "0000000000000000000000000000000000000000" ]; then
            base_sha="$(git rev-parse "${GITHUB_SHA}^")"
          fi
          git diff --name-only "$base_sha" "$GITHUB_SHA" | node scripts/detect-deploy-scope.mjs

  build-backend:
    needs: [verify, detect]
    if: needs.detect.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 构建后端镜像
        run: docker build -t "${BACKEND_IMAGE_NAME}:${GITHUB_SHA}" -f backend/Dockerfile backend

      - name: 导出后端镜像
        run: docker save "${BACKEND_IMAGE_NAME}:${GITHUB_SHA}" | gzip > xiaobao-jizhang-backend.tar.gz

      - name: 上传后端镜像制品
        uses: actions/upload-artifact@v4
        with:
          name: backend-image
          path: xiaobao-jizhang-backend.tar.gz
          retention-days: 1

  build-frontend:
    needs: [verify, detect]
    if: needs.detect.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 构建前端镜像
        run: docker build --build-arg NEXT_PUBLIC_API_URL=/api -t "${FRONTEND_IMAGE_NAME}:${GITHUB_SHA}" -f frontend/Dockerfile frontend

      - name: 导出前端镜像
        run: docker save "${FRONTEND_IMAGE_NAME}:${GITHUB_SHA}" | gzip > xiaobao-jizhang-frontend.tar.gz

      - name: 上传前端镜像制品
        uses: actions/upload-artifact@v4
        with:
          name: frontend-image
          path: xiaobao-jizhang-frontend.tar.gz
          retention-days: 1

  deploy:
    needs: [detect, build-backend, build-frontend]
    if: always() && needs.detect.outputs.should_deploy == 'true' && (needs.build-backend.result == 'success' || needs.build-backend.result == 'skipped') && (needs.build-frontend.result == 'success' || needs.build-frontend.result == 'skipped')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 下载后端镜像
        if: needs.detect.outputs.backend == 'true'
        uses: actions/download-artifact@v4
        with:
          name: backend-image

      - name: 下载前端镜像
        if: needs.detect.outputs.frontend == 'true'
        uses: actions/download-artifact@v4
        with:
          name: frontend-image

      - name: 准备部署文件
        env:
          DB_USER: ${{ vars.DB_USER || 'jizhang' }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ vars.DB_NAME || 'jizhang' }}
          JWT_ACCESS_SECRET: ${{ secrets.JWT_ACCESS_SECRET }}
          JWT_ADMIN_ACCESS_SECRET: ${{ secrets.JWT_ADMIN_ACCESS_SECRET }}
          ACCESS_TOKEN_TTL_SECONDS: ${{ vars.ACCESS_TOKEN_TTL_SECONDS || '900' }}
          REFRESH_SESSION_TTL_SECONDS: ${{ vars.REFRESH_SESSION_TTL_SECONDS || '2592000' }}
          ADMIN_ACCESS_TOKEN_TTL_SECONDS: ${{ vars.ADMIN_ACCESS_TOKEN_TTL_SECONDS || '900' }}
          ADMIN_REFRESH_SESSION_TTL_SECONDS: ${{ vars.ADMIN_REFRESH_SESSION_TTL_SECONDS || '2592000' }}
          CORS_ORIGINS: ${{ vars.CORS_ORIGINS || 'https://jizhang.xiaobao.work' }}
          BACKEND_PORT: ${{ vars.BACKEND_PORT || '8091' }}
          FRONTEND_PORT: ${{ vars.FRONTEND_PORT || '8090' }}
        run: |
          set -euo pipefail
          : "${DB_PASSWORD:?GitHub Environment 缺少 DB_PASSWORD}"
          : "${JWT_ACCESS_SECRET:?GitHub Environment 缺少 JWT_ACCESS_SECRET}"
          : "${JWT_ADMIN_ACCESS_SECRET:?GitHub Environment 缺少 JWT_ADMIN_ACCESS_SECRET}"
          umask 077
          {
            printf 'DB_USER=%s\n' "$DB_USER"
            printf 'DB_PASSWORD=%s\n' "$DB_PASSWORD"
            printf 'DB_NAME=%s\n' "$DB_NAME"
            printf 'JWT_ACCESS_SECRET=%s\n' "$JWT_ACCESS_SECRET"
            printf 'JWT_ADMIN_ACCESS_SECRET=%s\n' "$JWT_ADMIN_ACCESS_SECRET"
            printf 'ACCESS_TOKEN_TTL_SECONDS=%s\n' "$ACCESS_TOKEN_TTL_SECONDS"
            printf 'REFRESH_SESSION_TTL_SECONDS=%s\n' "$REFRESH_SESSION_TTL_SECONDS"
            printf 'ADMIN_ACCESS_TOKEN_TTL_SECONDS=%s\n' "$ADMIN_ACCESS_TOKEN_TTL_SECONDS"
            printf 'ADMIN_REFRESH_SESSION_TTL_SECONDS=%s\n' "$ADMIN_REFRESH_SESSION_TTL_SECONDS"
            printf 'CORS_ORIGINS=%s\n' "$CORS_ORIGINS"
            printf 'BACKEND_PORT=%s\n' "$BACKEND_PORT"
            printf 'FRONTEND_PORT=%s\n' "$FRONTEND_PORT"
          } > production.env.new
          mkdir -p deployment-bundle
          cp docker-compose.prod.yml scripts/deploy-prod.sh scripts/backup-prod.sh deployment-bundle/
          cp production.env.new deployment-bundle/
          if [ -f xiaobao-jizhang-backend.tar.gz ]; then cp xiaobao-jizhang-backend.tar.gz deployment-bundle/; fi
          if [ -f xiaobao-jizhang-frontend.tar.gz ]; then cp xiaobao-jizhang-frontend.tar.gz deployment-bundle/; fi
          rm -f production.env.new
          test -n "$(find deployment-bundle -type f -print -quit)"

      - name: 自动准备服务器目录
        env:
          DEPLOY_PATH: ${{ vars.JIZHANG_DEPLOY_PATH || '/www/wwwroot/xiaobao-jizhang' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: mkdir -p "$DEPLOY_PATH/backups"
          envs: DEPLOY_PATH

      - name: 上传部署文件
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: deployment-bundle
          target: ${{ vars.JIZHANG_DEPLOY_PATH || '/www/wwwroot/xiaobao-jizhang' }}
          strip_components: 1

      - name: 远程部署
        uses: appleboy/ssh-action@v1.0.3
        env:
          BACKEND_CHANGED: ${{ needs.detect.outputs.backend }}
          FRONTEND_CHANGED: ${{ needs.detect.outputs.frontend }}
          DEPLOYMENT_CHANGED: ${{ needs.detect.outputs.deployment }}
          RELEASE_TAG: ${{ github.sha }}
          DEPLOY_PATH: ${{ vars.JIZHANG_DEPLOY_PATH || '/www/wwwroot/xiaobao-jizhang' }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          command_timeout: 30m
          envs: BACKEND_CHANGED,FRONTEND_CHANGED,DEPLOYMENT_CHANGED,RELEASE_TAG,DEPLOY_PATH
          script: |
            set -eu
            cd "$DEPLOY_PATH"
            BACKEND_CHANGED="$BACKEND_CHANGED" \
            FRONTEND_CHANGED="$FRONTEND_CHANGED" \
            DEPLOYMENT_CHANGED="$DEPLOYMENT_CHANGED" \
            RELEASE_TAG="$RELEASE_TAG" \
              sh ./deploy-prod.sh
